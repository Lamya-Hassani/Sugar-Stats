<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gérer la Commande | Sugar & Stats Admin</title>
    <!-- Fonts -->
    <link
        href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Poppins:wght@300;400;500;600&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* Styles adapted for Horizontal Layout + No Overflow */
        :root {
            /* Ensuring variables exist if css file is missing/different */
            --c-text-deep: #4E342E;
            --c-text-muted: #8D6E63;
            --c-magenta: #D81B60;
            --c-glass-white: rgba(255, 255, 255, 0.85);
            --glass-blur: blur(20px);
            --radius-card: 24px;
            --shadow-pop: 0 10px 40px rgba(216, 27, 96, 0.15);
            --gradient-brand: linear-gradient(135deg, #D81B60 0%, #FF80AB 100%);
        }

        * {
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: transparent;
            color: var(--c-text-deep);
            margin: 0;
            /* CENTERED & NO SCROLL */
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            padding: 0;
        }

        .form-container {
            background: var(--c-glass-white);
            backdrop-filter: var(--glass-blur);
            -webkit-backdrop-filter: var(--glass-blur);
            padding: 3rem;
            border-radius: var(--radius-card);
            border: 1px solid rgba(255, 255, 255, 0.9);
            box-shadow: var(--shadow-pop);

            /* Sizing for Horizontal Layout */
            width: 90%;
            max-width: 1100px;
            position: relative;
            z-index: 10;
        }

        h1 {
            font-family: 'Playfair Display', serif;
            font-size: 2.2rem;
            margin: 0 0 2rem 0;
            color: var(--c-magenta);
            text-align: center;
        }

        .id-badge {
            display: table;
            margin: 0 auto 2rem auto;
            background: rgba(216, 27, 96, 0.1);
            color: var(--c-magenta);
            padding: 0.3rem 0.8rem;
            border-radius: 50px;
            font-size: 0.85rem;
            font-weight: 600;
        }

        /* 4-COLUMN HORIZONTAL GRID */
        .form-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 1.5rem;
            align-items: end;
            /* Aligns inputs nicely */
        }

        .form-group {
            margin-bottom: 0.5rem;
            /* Reduced margin since grid handles spacing */
        }

        /* Span Helpers */
        .span-1 {
            grid-column: span 1;
        }

        .span-2 {
            grid-column: span 2;
        }

        .span-4 {
            grid-column: span 4;
        }

        label {
            display: block;
            font-weight: 600;
            margin-bottom: 0.5rem;
            font-size: 0.8rem;
            color: var(--c-text-muted);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        input,
        select,
        textarea {
            width: 100%;
            padding: 1rem;
            border: 1px solid rgba(0, 0, 0, 0.1);
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.6);
            font-family: inherit;
            font-size: 0.95rem;
            color: var(--c-text-deep);
            transition: 0.3s ease;
        }

        input:focus,
        select:focus,
        textarea:focus {
            outline: none;
            border-color: var(--c-magenta);
            background: white;
            box-shadow: 0 0 15px rgba(216, 27, 96, 0.15);
        }

        textarea {
            resize: none;
            /* Prevents breaking layout */
        }

        .btn-row {
            display: flex;
            justify-content: flex-end;
            gap: 1rem;
            margin-top: 2rem;
            grid-column: 1 / -1;
        }

        .btn {
            padding: 1rem 3rem;
            border-radius: 50px;
            border: none;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
            font-family: 'Poppins', sans-serif;
            font-size: 1rem;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }

        .cancel-btn {
            background: #FFF;
            color: var(--c-text-muted);
            border: 1px solid rgba(0, 0, 0, 0.1);
        }

        .save-btn {
            background: var(--gradient-brand);
            color: white;
            box-shadow: 0 5px 15px rgba(216, 27, 96, 0.3);
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(216, 27, 96, 0.3);
        }

        .cancel-btn:hover {
            color: var(--c-text-deep);
            background: #F5F5F5;
        }

        .items-list {
            margin-top: 0.5rem;
            background: rgba(0, 0, 0, 0.02);
            padding: 1rem;
            border-radius: 16px;
            border: 1px solid rgba(0, 0, 0, 0.05);
            max-height: 150px;
            overflow-y: auto;
        }
    </style>
    <link rel='stylesheet' href='../../../styles/admin-theme.css'>
</head>

<body>
    <div class="form-container">
        <h1>Calibrage de Commande</h1>
        <div class="id-badge" id="display-id">ID: ...</div>

        <!-- Horizontal Grid Form -->
        <form id="orderForm" class="form-grid">
            <input type="hidden" id="orderId">

            <!-- Row 1: Client (50%) & Status (50%) -->
            <div class="form-group span-2">
                <label for="clientId">Sujet Client</label>
                <select id="clientId" required></select>
            </div>

            <div class="form-group span-2">
                <label for="status">Statut Logistique</label>
                <select id="status">
                    <option value="En attente">En attente</option>
                    <option value="Expédié">Expédié</option>
                    <option value="Livré">Livré</option>
                </select>
            </div>

            <!-- Row 2: Amount (50%) & Date (50%) -->
            <div class="form-group span-2">
                <label for="totalAmount">Montant Total (Calculé)</label>
                <input type="number" id="totalAmount" step="0.01" required placeholder="0.00" readonly
                    style="background:rgba(0,0,0,0.03); cursor:not-allowed;">
            </div>

            <div class="form-group span-2">
                <label for="orderDate">Date d'Emission</label>
                <input type="date" id="orderDate">
            </div>

            <!-- Row 3: Items (Full Width) -->
            <div class="form-group span-4">
                <label>Inventaire des Produits</label>

                <!-- Add Item Controls -->
                <div style="display:flex; gap:1rem; margin-bottom:1rem; align-items:center;">
                    <select id="productSelect" style="flex:2;">
                        <option value="">Chargement des produits...</option>
                    </select>
                    <input type="number" id="productQuantity" value="1" min="1" style="flex:0.5; text-align: center;">
                    <button type="button" onclick="window.addItemToOrder()" class="btn"
                        style="padding:0.8rem 1.5rem; background:var(--c-magenta); color:white; border:none; box-shadow:none; border-radius:12px; font-size:0.9rem;">
                        <i class="fas fa-plus"></i>
                    </button>
                </div>

                <div id="itemsContainer" class="items-list">
                    <!-- Items table will be rendered here -->
                </div>
            </div>

            <!-- Buttons -->
            <div class="btn-row">
                <a href="list.html" class="btn cancel-btn">Annuler</a>
                <button type="submit" class="btn save-btn">Mettre à Jour</button>
            </div>
        </form>
    </div>

    <!-- Background 3D Script & Dependencies -->
    <script src="https://unpkg.com/three@0.136.0/build/three.min.js"></script>

    <script src='../../../scripts/admin/pastry-bg.js'></script>
    <script src='../../../scripts/admin/admin-utils.js'></script>
    <script src="../../../scripts/admin/orders.js"></script>
    <script>
        const user = JSON.parse(localStorage.getItem('authUser')) || JSON.parse(localStorage.getItem('user'));
        // Security check commented out for dev
        // if (!user || user.role !== 'admin') { window.location.href = '../../auth.html'; }

        document.addEventListener('DOMContentLoaded', async () => {
            await prefillOrderForm();
            const id = document.getElementById('orderId').value;
            if (id) document.getElementById('display-id').textContent = `Commande #${id}`;
        });

        document.getElementById('orderForm').addEventListener('submit', (e) => {
            saveOrder(e);
        });
    </script>
</body>

</html>
