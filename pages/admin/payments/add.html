<html lang="fr">

<head>

    <title>Nouveau Paiement | Sugar & Stats Admin</title>
    <!-- Fonts -->
    <link
        href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Poppins:wght@300;400;500;600&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* Styles adapted for Horizontal Layout + No Overflow */
        :root {
            /* Ensuring variables exist if css file is missing/different */
            --c-text-deep: #4E342E;
            --c-text-muted: #8D6E63;
            --c-magenta: #D81B60;
            --c-glass-white: rgba(255, 255, 255, 0.85);
            --glass-blur: blur(20px);
            --radius-card: 24px;
            --shadow-pop: 0 10px 40px rgba(216, 27, 96, 0.15);
            --gradient-brand: linear-gradient(135deg, #D81B60 0%, #FF80AB 100%);
        }

        * {
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: transparent;
            color: var(--c-text-deep);
            margin: 0;
            /* CENTERED & NO SCROLL */
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            padding: 0;
        }

        .form-container {
            background: var(--c-glass-white);
            backdrop-filter: var(--glass-blur);
            -webkit-backdrop-filter: var(--glass-blur);
            padding: 3rem;
            border-radius: var(--radius-card);
            border: 1px solid rgba(255, 255, 255, 0.9);
            box-shadow: var(--shadow-pop);

            /* Sizing for Horizontal Layout */
            width: 90%;
            max-width: 1100px;
            position: relative;
            z-index: 10;
        }

        h1 {
            font-family: 'Playfair Display', serif;
            font-size: 2.2rem;
            margin: 0 0 2rem 0;
            color: var(--c-magenta);
            text-align: center;
        }

        /* 4-COLUMN HORIZONTAL GRID */
        .form-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 1.5rem;
            align-items: end;
            /* Aligns inputs nicely */
        }

        .form-group {
            margin-bottom: 0.5rem;
            /* Reduced margin since grid handles spacing */
        }

        /* Span Helpers */
        .span-1 {
            grid-column: span 1;
        }

        .span-2 {
            grid-column: span 2;
        }

        .span-4 {
            grid-column: span 4;
        }

        label {
            display: block;
            font-weight: 600;
            margin-bottom: 0.5rem;
            font-size: 0.8rem;
            color: var(--c-text-muted);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        input,
        select,
        textarea {
            width: 100%;
            padding: 1rem;
            border: 1px solid rgba(0, 0, 0, 0.1);
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.6);
            font-family: inherit;
            font-size: 0.95rem;
            color: var(--c-text-deep);
            transition: 0.3s ease;
        }

        input:focus,
        select:focus,
        textarea:focus {
            outline: none;
            border-color: var(--c-magenta);
            background: white;
            box-shadow: 0 0 15px rgba(216, 27, 96, 0.15);
        }

        textarea {
            resize: none;
            /* Prevents breaking layout */
        }

        .btn-row {
            display: flex;
            justify-content: flex-end;
            gap: 1rem;
            margin-top: 2rem;
            grid-column: 1 / -1;
        }

        .btn {
            padding: 1rem 3rem;
            border-radius: 50px;
            border: none;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
            font-family: 'Poppins', sans-serif;
            font-size: 1rem;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }

        .cancel-btn {
            background: #FFF;
            color: var(--c-text-muted);
            border: 1px solid rgba(0, 0, 0, 0.1);
        }

        .save-btn {
            background: var(--gradient-brand);
            color: white;
            box-shadow: 0 5px 15px rgba(216, 27, 96, 0.3);
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(216, 27, 96, 0.3);
        }

        .cancel-btn:hover {
            color: var(--c-text-deep);
            background: #F5F5F5;
        }
    </style>
    <link rel='stylesheet' href='../../../styles/admin-theme.css'>
</head>

<body>
    <div class="form-container">
        <h1>Nouveau Paiement</h1>

        <!-- Horizontal Grid Form -->
        <form id="paymentForm" class="form-grid">
            <input type="hidden" id="paymentId">

            <!-- Row 1: Client (50%) & Order (50%) -->
            <div class="form-group span-2">
                <label for="clientId">Sujet Client</label>
                <select id="clientId" required></select>
            </div>

            <div class="form-group span-2">
                <label for="orderId">Commande Liée</label>
                <select id="orderId" required></select>
            </div>

            <!-- Row 2: Amount (25%), Method (25%), Status (25%), Date (25%) -->
            <div class="form-group span-1">
                <label for="amount">Montant ($)</label>
                <input type="number" id="amount" step="0.01" required placeholder="0.00">
            </div>

            <div class="form-group span-1">
                <label for="paymentMethod">Méthode</label>
                <select id="paymentMethod">
                    <option value="Carte Bancaire">💳 Carte Bancaire</option>
                    <option value="PayPal">🅿️ PayPal</option>
                    <option value="Virement">🏛️ Virement</option>
                </select>
            </div>

            <div class="form-group span-1">
                <label for="paymentStatus">Statut</label>
                <select id="paymentStatus">
                    <option value="Completed">✅ Validé</option>
                    <option value="Pending">⏳ En attente</option>
                    <option value="Failed">❌ Échec</option>
                </select>
            </div>

            <div class="form-group span-1">
                <label for="paymentDate">Date</label>
                <input type="date" id="paymentDate">
            </div>

            <!-- Row 3: Transaction ID (Full Width) -->
            <div class="form-group span-4">
                <label for="transactionId">ID de Transaction</label>
                <input type="text" id="transactionId" required placeholder="Ex: TXN-123456">
            </div>

            <!-- Buttons -->
            <div class="btn-row">
                <a href="list.html" class="btn cancel-btn">Annuler</a>
                <button type="submit" class="btn save-btn">Enregistrer le Flux</button>
            </div>
        </form>
    </div>
