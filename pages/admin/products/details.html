<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Details - Sugar & Stats</title>
    <link rel="stylesheet" href="../../styles.css">
    <!-- Bootstrap and jsPDF CDNs -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>
<body>
    <!-- Sidebar and Navbar same -->
    <div class="d-flex">
        <div class="sidebar bg-light p-3">
            <!-- Same -->
        </div>
        <div class="flex-grow-1">
            <!-- Same navbar -->
            <div class="container mt-4">
                <h2>Product Details</h2>
                <div id="detailsContent"></div>
                {# <button class="btn btn-secondary mt-3" onclick="exportToPDF()">Export to PDF</button> #}
                <button class="btn btn-primary mt-3" onclick="window.location.href='list.html'">Back to List</button>
            </div>
        </div>
    </div>
    <script src="../../scripts/products.js"></script>
    <script>
        if (!localStorage.getItem('loggedIn')) window.location.href = '../../index.html';
        const urlParams = new URLSearchParams(window.location.search);
        const productId = urlParams.get('id');
        if (productId) showDetails(productId); // From products.js
    </script>
</body>
</html>
