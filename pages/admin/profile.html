<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mon Profil Admin | Sugar & Stats</title>
    <!-- Fonts -->
    <link
        href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Poppins:wght@300;400;500;600&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --c-text-deep: #4E342E;
            --c-text-muted: #8D6E63;
            --c-magenta: #D81B60;
            --c-glass-white: rgba(255, 255, 255, 0.85);
            --glass-blur: blur(20px);
            --radius-card: 24px;
            --shadow-pop: 0 10px 40px rgba(216, 27, 96, 0.15);
            --gradient-brand: linear-gradient(135deg, #D81B60 0%, #FF80AB 100%);
        }

        * {
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: transparent;
            color: var(--c-text-deep);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            padding: 0;
        }

        .form-container {
            background: var(--c-glass-white);
            backdrop-filter: var(--glass-blur);
            -webkit-backdrop-filter: var(--glass-blur);
            padding: 3rem;
            border-radius: var(--radius-card);
            border: 1px solid rgba(255, 255, 255, 0.9);
            box-shadow: var(--shadow-pop);
            width: 90%;
            max-width: 900px;
            position: relative;
            z-index: 10;
        }

        h1 {
            font-family: 'Playfair Display', serif;
            font-size: 2.2rem;
            margin: 0 0 2rem 0;
            color: var(--c-magenta);
            text-align: center;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 1.5rem;
        }

        .form-group {
            margin-bottom: 0.5rem;
        }

        .span-2 {
            grid-column: span 2;
        }

        label {
            display: block;
            font-weight: 600;
            margin-bottom: 0.5rem;
            font-size: 0.8rem;
            color: var(--c-text-muted);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        input {
            width: 100%;
            padding: 1rem;
            border: 1px solid rgba(0, 0, 0, 0.1);
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.6);
            font-family: inherit;
            font-size: 0.95rem;
            color: var(--c-text-deep);
            transition: 0.3s ease;
        }

        input:focus {
            outline: none;
            border-color: var(--c-magenta);
            background: white;
            box-shadow: 0 0 15px rgba(216, 27, 96, 0.15);
        }

        input:disabled {
            background: rgba(0, 0, 0, 0.05);
            color: #777;
        }

        .btn-row {
            display: flex;
            justify-content: flex-end;
            gap: 1rem;
            margin-top: 2rem;
            grid-column: 1 / -1;
        }

        .btn {
            padding: 1rem 3rem;
            border-radius: 50px;
            border: none;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
            font-family: 'Poppins', sans-serif;
            font-size: 1rem;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }

        .cancel-btn {
            background: #FFF;
            color: var(--c-text-muted);
            border: 1px solid rgba(0, 0, 0, 0.1);
        }

        .save-btn {
            background: var(--gradient-brand);
            color: white;
            box-shadow: 0 5px 15px rgba(216, 27, 96, 0.3);
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(216, 27, 96, 0.3);
        }
    </style>
    <link rel='stylesheet' href='../../styles/admin-theme.css'>
</head>

<body>
    <div class="form-container">
        <h1>Mon Profil</h1>

        <form id="profileForm" class="form-grid">
            <input type="hidden" id="adminId">

            <div class="form-group">
                <label>Nom d'utilisateur</label>
                <input type="text" id="username" disabled>
            </div>

            <div class="form-group">
                <label>Nom Complet</label>
                <input type="text" id="name" required>
            </div>

            <div class="form-group span-2">
                <label>Email</label>
                <input type="email" id="email" required>
            </div>

            <div class="form-group span-2">
                <label>Nouveau Mot de Passe</label>
                <input type="password" id="password" placeholder="Laisser vide pour ne pas changer">
            </div>

            <div class="btn-row">
                <a href="index.html" class="btn cancel-btn">Retour</a>
                <button type="submit" class="btn save-btn">Enregistrer</button>
            </div>
        </form>
    </div>

    <!-- Background 3D Script & Dependencies -->
    <script src="https://unpkg.com/three@0.136.0/build/three.min.js"></script>
    <script src='../../scripts/admin/pastry-bg.js'></script>
    <script src='../../scripts/admin/admin-utils.js'></script>
    <script src="../../scripts/admin/profile.js"></script>
</body>

</html>
