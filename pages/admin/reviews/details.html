    <link

    <style>
        :root {
            /* THEME: Vanilla Strawberry Luxury */
            --c-text-main: #4E342E;
            --c-text-light: #8D6E63;
            --c-rose: #D81B60;
            --c-pop: #FF6D00;

            /* Glassmorphism */
            --glass-bg: rgba(255, 255, 255, 0.75);
            --glass-border: 1px solid rgba(255, 255, 255, 1.0);
            --glass-shadow: 0 8px 32px 0 rgba(216, 27, 96, 0.05);
            --radius-card: 24px;
        }

        * {
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: transparent;
            color: var(--c-text-main);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 2rem;
        }

        .details-card {
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            padding: 3rem;
            border-radius: var(--radius-card);
            border: var(--glass-border);
            box-shadow: var(--glass-shadow);
            width: 100%;
            max-width: 600px;
            position: relative;
            z-index: 10;
        }

        h2 {
            font-family: 'Playfair Display', serif;
            font-size: 2.2rem;
            margin-bottom: 2rem;
            color: var(--c-rose);
            text-align: center;
            border-bottom: 1px solid rgba(216, 27, 96, 0.2);
            padding-bottom: 1rem;
        }

        #detailsContent {
            margin-bottom: 2rem;
        }

        .btn {
            padding: 0.8rem 2rem;
            border-radius: 50px;
            border: none;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
            font-family: 'Poppins', sans-serif;
            text-decoration: none;
            display: inline-block;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--c-rose) 0%, #EC407A 100%);
            color: white;
            box-shadow: 0 5px 15px rgba(216, 27, 96, 0.3);
            display: block;
            width: 100%;
            text-align: center;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(216, 27, 96, 0.4);
        }
    </style>
    <link rel='stylesheet' href='../../../styles/admin-theme.css'>
</head>
