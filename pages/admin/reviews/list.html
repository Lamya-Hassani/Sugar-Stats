<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feedback | Sugar & Stats Admin</title>
    <!-- Fonts -->
    <link
        href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Poppins:wght@300;400;500;600&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            /* THEME: Vanilla Strawberry Luxury */
            --c-text-main: #4E342E;
            --c-text-light: #8D6E63;
            --c-rose: #D81B60;
            --c-pop: #FF6D00;
            --glass-bg: rgba(255, 255, 255, 0.65);
            --glass-border: 1px solid rgba(255, 255, 255, 1.0);
            --glass-shadow: 0 8px 32px 0 rgba(216, 27, 96, 0.05);
            --radius-card: 24px;
        }

        * {
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: transparent;
            color: var(--c-text-main);
            margin: 0;
            display: flex;
            min-height: 100vh;
        }

        /* --- SIDEBAR --- */
        .sidebar {
            width: 280px;
            height: 100vh;
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(20px);
            border-right: 1px solid rgba(255, 255, 255, 0.8);
            padding: 2.5rem 1.5rem;
            position: fixed;
            z-index: 100;
            display: flex;
            flex-direction: column;
            box-shadow: 5px 0 20px rgba(78, 52, 46, 0.05);
        }

        .brand {
            font-family: 'Playfair Display', serif;
            font-size: 1.8rem;
            font-weight: 700;
            font-style: italic;
            margin-bottom: 3.5rem;
            color: var(--c-rose);
            text-align: center;
            text-decoration: none;
            display: block;
        }

        .nav-links {
            list-style: none;
            padding: 0;
            flex-grow: 1;
        }

        .nav-link {
            display: flex;
            align-items: center;
            gap: 1.2rem;
            padding: 1rem 1.5rem;
            text-decoration: none;
            color: var(--c-text-light);
            border-radius: 20px;
            transition: 0.3s;
            font-weight: 500;
        }

        .nav-link.active {
            background: linear-gradient(135deg, var(--c-rose) 0%, #EC407A 100%);
            color: white;
            box-shadow: 0 4px 15px rgba(216, 27, 96, 0.3);
        }

        .main {
            margin-left: 280px;
            padding: 3rem 4rem;
            width: 100%;
            position: relative;
            z-index: 1;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
            background: var(--glass-bg);
            backdrop-filter: blur(8px);
            padding: 1.5rem 2rem;
            border-radius: var(--radius-card);
            border: var(--glass-border);
            box-shadow: var(--glass-shadow);
        }

        .btn {
            padding: 0.8rem 1.5rem;
            border-radius: 50px;
            text-decoration: none;
            font-weight: 600;
            transition: 0.3s;
            display: inline-flex;
            gap: 0.5rem;
            border: none;
            cursor: pointer;
            font-family: inherit;
        }

        .btn-secondary {
            background: white;
            color: var(--c-text-main);
            border: 1px solid rgba(0, 0, 0, 0.1);
        }

        .search-container {
            margin-bottom: 2rem;
            position: relative;
        }

        .search-input {
            width: 100%;
            padding: 0.8rem 1rem 0.8rem 3rem;
            border-radius: 50px;
            border: 1px solid rgba(0, 0, 0, 0.1);
            background: var(--glass-bg);
            outline: none;
        }

        .search-container i {
            position: absolute;
            left: 1.2rem;
            top: 50%;
            transform: translateY(-50%);
            color: var(--c-text-light);
        }

        .table-container {
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            border-radius: var(--radius-card);
            border: var(--glass-border);
            box-shadow: var(--glass-shadow);
            overflow: hidden;
            margin-bottom: 2rem;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }

        th {
            background: rgba(216, 27, 96, 0.05);
            padding: 1.2rem;
            font-size: 0.85rem;
            text-transform: uppercase;
            color: var(--c-text-light);
            cursor: pointer;
        }

        td {
            padding: 1.2rem;
            border-bottom: 1px solid rgba(0, 0, 0, 0.05);
            font-size: 0.9rem;
        }

        .star-rating {
            color: #FFD600;
            font-size: 0.8rem;
        }

        .actions-cell {
            display: flex;
            gap: 0.5rem;
        }

        .icon-btn {
            width: 35px;
            height: 35px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            border: none;
            font-size: 0.9rem;
        }

        .btn-view {
            background: #E3F2FD;
            color: #1565C0;
        }

        .btn-delete {
            background: #FFEBEE;
            color: #C62828;
        }

        .pagination {
            display: flex;
            justify-content: center;
            gap: 0.5rem;
        }

        .page-btn {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--glass-bg);
            border: var(--glass-border);
            cursor: pointer;
            transition: 0.3s;
        }

        .page-btn.active {
            background: var(--c-rose) !important;
            color: white !important;
        }
    </style>
    <link rel='stylesheet' href='../../../styles/admin-theme.css'>
</head>

<body>
    <div class="sidebar">
        <a href="../index.html" class="brand">Sugar & Stats</a>
        <ul class="nav-links">
            <li><a href="../index.html" class="nav-link"><i class="fas fa-home"></i> Home</a></li>
            <li><a href="../products/list.html" class="nav-link"><i class="fas fa-cookie-bite"></i> Creations</a></li>
            <li><a href="../clients/list.html" class="nav-link"><i class="fas fa-users"></i> Clients</a></li>
            <li><a href="../categories/list.html" class="nav-link"><i class="fas fa-tag"></i> Segments</a></li>
            <li><a href="../orders/list.html" class="nav-link"><i class="fas fa-box-open"></i> Orders</a></li>
            <li><a href="../employees/list.html" class="nav-link"><i class="fas fa-id-card"></i> Personnel</a></li>
            <li><a href="../payments/list.html" class="nav-link"><i class="fas fa-wallet"></i> Finance</a></li>
            <li><a href="list.html" class="nav-link active"><i class="fas fa-heart"></i> Reviews</a></li>
        </ul>
    </div>

    <div class="main">
        <div class="header">
            <div>
                <h1>Opinion Laboratory</h1>
                <p>Sensory analysis and gourmet feedback.</p>
            </div>
            <div style="display: flex; gap: 1rem;">
                <button class="btn btn-secondary" onclick="exportReviewsCSV()"><i class="fas fa-file-csv"></i>
                    Export CSV</button>
            </div>
        </div>

        <div class="search-container">
            <i class="fas fa-search"></i>
            <input type="text" id="searchInput" class="search-input" placeholder="Search in comments..."
                oninput="handleSearch()">
        </div>

        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th onclick="handleSort('productId')">Masterpiece <i class="fas fa-sort"></i></th>
                        <th onclick="handleSort('clientId')">Gourmet Subject <i class="fas fa-sort"></i></th>
                        <th onclick="handleSort('rating')">Score <i class="fas fa-sort"></i></th>
                        <th>Feedback & Feeling</th>
                        <th onclick="handleSort('date')">Tasting Date <i class="fas fa-sort"></i></th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="reviewsTableBody"></tbody>
            </table>
        </div>
        <div id="pagination" class="pagination"></div>
    </div>

    <script src="https://unpkg.com/three@0.136.0/build/three.min.js"></script>

    <script src='../../../scripts/admin/pastry-bg.js'></script>
    <script src='../../../scripts/admin/luxury-ui.js'></script>
    <script src="../../../scripts/admin/admin-utils.js"></script>
    <script src="../../../scripts/admin/reviews.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => { renderReviewsTable(); });
    </script>
</body>

</html>
