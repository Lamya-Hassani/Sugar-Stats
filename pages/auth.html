<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sugar & Stats | Portal</title>
  
  <!-- Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Lato:wght@300;400;700&display=swap" rel="stylesheet">

  <style>
    /* --- 1. VARIABLES --- */
    :root {
      --c-bg: #FFF5F7;
      --c-text: #5D4037;
      --c-accent: #D48C9D;
      --c-accent-dark: #B86B77;
      --c-white: #FFFFFF;
      --c-input: #FCF8F9;
      --shadow: 0 14px 28px rgba(93, 64, 55, 0.1), 0 10px 10px rgba(93, 64, 55, 0.1);
      --radius: 20px;
      --transition: 0.6s ease-in-out;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Lato', sans-serif;
      background: var(--c-bg);
      /* Hero Image Background */
      background-image: linear-gradient(rgba(255, 245, 247, 0.85), rgba(255, 245, 247, 0.85)), url('https://images.unsplash.com/photo-1567171466295-4afa63d45416?q=80&w=2600&auto=format&fit=crop');
      background-size: cover;
      background-position: center;
      display: flex;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      height: 100vh;
      color: var(--c-text);
    }

    /* --- 2. TYPOGRAPHY --- */
    h1 {
      font-family: 'Playfair Display', serif;
      font-weight: 700;
      margin: 0;
      font-size: 2.5rem;
    }
    h2 {
      font-family: 'Playfair Display', serif;
      text-align: center;
      margin-bottom: 1.5rem;
      font-size: 2rem;
      color: var(--c-text);
    }
    p {
      font-size: 0.9rem;
      font-weight: 400;
      line-height: 1.5;
      letter-spacing: 0.5px;
      margin: 20px 0 30px;
    }
    span { font-size: 0.8rem; margin-top: 10px; display: block; }

    /* --- 3. MAIN CONTAINER (The Card) --- */
    .container {
      background-color: var(--c-white);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      position: relative;
      overflow: hidden;
      width: 1000px;
      max-width: 100%;
      min-height: 600px;
    }

    /* --- 4. FORM LAYOUTS --- */
    .form-container {
      position: absolute;
      top: 0;
      height: 100%;
      transition: all var(--transition);
      padding: 0 50px;
      display: flex;
      flex-direction: column;
      justify-content: center; /* Center Vertically */
    }

    form {
      background-color: var(--c-white);
      display: flex;
      align-items: center; /* Center Horizontally */
      justify-content: center; /* Center Vertically */
      flex-direction: column;
      height: 100%;
      text-align: center;
      width: 100%;
    }

    /* Inputs */
    input {
      background-color: var(--c-input);
      border: 1px solid #eee;
      padding: 12px 15px;
      margin: 8px 0;
      width: 100%;
      border-radius: 8px;
      font-family: 'Lato', sans-serif;
      outline: none;
      transition: 0.3s;
    }
    input:focus {
      border-color: var(--c-accent);
      background-color: #fff;
    }

    /* Buttons */
    button {
      border-radius: 20px;
      border: 1px solid var(--c-accent);
      background-color: var(--c-accent);
      color: #FFFFFF;
      font-size: 12px;
      font-weight: bold;
      padding: 12px 45px;
      letter-spacing: 1px;
      text-transform: uppercase;
      transition: transform 80ms ease-in, background 0.3s;
      cursor: pointer;
      margin-top: 1.5rem;
    }
    button:active { transform: scale(0.95); }
    button:focus { outline: none; }
    button:hover { background-color: var(--c-accent-dark); border-color: var(--c-accent-dark); }

    /* Ghost Button (For the Overlay) */
    button.ghost {
      background-color: transparent;
      border-color: #FFFFFF;
    }
    button.ghost:hover {
      background-color: #FFFFFF;
      color: var(--c-text);
    }

    /* --- 5. ANIMATION LOGIC --- */
    
    .sign-in-container {
      left: 0;
      width: 50%;
      z-index: 2;
    }

    .sign-up-container {
      left: 0;
      width: 50%;
      opacity: 0;
      z-index: 1;
    }

    /* ACTIVE STATE */
    .container.right-panel-active .sign-in-container {
      transform: translateX(100%);
    }

    .container.right-panel-active .sign-up-container {
      transform: translateX(100%);
      opacity: 1;
      z-index: 5;
      animation: show 0.6s;
    }

    @keyframes show {
      0%, 49.99% { opacity: 0; z-index: 1; }
      50%, 100% { opacity: 1; z-index: 5; }
    }

    /* --- 6. THE OVERLAY --- */
    .overlay-container {
      position: absolute;
      top: 0;
      left: 50%;
      width: 50%;
      height: 100%;
      overflow: hidden;
      transition: transform var(--transition);
      z-index: 100;
    }

    .container.right-panel-active .overlay-container {
      transform: translateX(-100%);
    }

    .overlay {
      background: var(--c-text);
      background: linear-gradient(to right, var(--c-text), var(--c-accent));
      background-repeat: no-repeat;
      background-size: cover;
      background-position: 0 0;
      color: #FFFFFF;
      position: relative;
      left: -100%;
      height: 100%;
      width: 200%;
      transform: translateX(0);
      transition: transform var(--transition);
    }

    .container.right-panel-active .overlay {
      transform: translateX(50%);
    }

    .overlay-panel {
      position: absolute;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      padding: 0 40px;
      text-align: center;
      top: 0;
      height: 100%;
      width: 50%;
      transform: translateX(0);
      transition: transform var(--transition);
    }

    .overlay-panel h1 { color: white; margin-bottom: 10px; }
    .overlay-panel p { color: rgba(255,255,255,0.9); }

    .overlay-left { transform: translateX(-20%); }
    .container.right-panel-active .overlay-left { transform: translateX(0); }

    .overlay-right { right: 0; transform: translateX(0); }
    .container.right-panel-active .overlay-right { transform: translateX(20%); }

    /* Utility */
    .msg-box { font-size: 0.8rem; margin-top: 15px; color: var(--c-text); font-weight: bold; }

    /* Mobile */
    @media (max-width: 768px) {
      .container { width: 100%; min-height: 800px; flex-direction: column; }
      .form-container { width: 100%; height: 60%; top: 40%; padding: 0 20px;}
      .sign-up-container { opacity: 1; z-index: 1; top: 40%; }
      .overlay-container { width: 100%; height: 40%; top: 0; left: 0; }
    }
  </style>
</head>
<body>

  <div class="container" id="container">
    
    <!-- REGISTER FORM -->
    <div class="form-container sign-up-container">
      <form id="register-form">
        <h2>Créer un compte</h2>
        <input type="text" id="register-username" placeholder="Username" required />
        <input type="email" id="register-email" placeholder="Email" required />
        <input type="text" id="register-name" placeholder="Nom complet" />
        <input type="password" id="register-password" placeholder="Mot de passe" required />
        
        <button type="submit">S'inscrire</button>
        <div id="register-message" class="msg-box"></div>
      </form>
    </div>

    <!-- LOGIN FORM -->
    <div class="form-container sign-in-container">
      <form id="login-form">
        <h2>Se connecter</h2>
        <span>Utilisez votre compte</span>
        <input type="text" id="login-username" placeholder="Username" required />
        <input type="password" id="login-password" placeholder="Mot de passe" required />
        <a href="#" style="font-size:0.8rem; margin:10px 0; color:#888;">Mot de passe oublié ?</a>
        <button type="submit">Access The Lab</button>
        <div id="login-message" class="msg-box"></div>
      </form>
    </div>

    <!-- OVERLAY -->
    <div class="overlay-container">
      <div class="overlay">
        
        <!-- Left Overlay (Visible when Registering) -->
        <div class="overlay-panel overlay-left">
          <h1>Welcome Back!</h1>
          <p>Pour rester connecté avec nous, veuillez vous connecter avec vos informations.</p>
          <button class="ghost" id="signIn">Se connecter</button>
        </div>

        <!-- Right Overlay (Visible when Logging In) -->
        <div class="overlay-panel overlay-right">
          <h1>Sugar & Stats</h1>
          <p>Entrez vos informations personnelles et commencez votre voyage avec nous.</p>
          <button class="ghost" id="signUp">Rejoindre</button>
        </div>

      </div>
    </div>

  </div>

  <!-- Scripts -->
  <script src="../scripts/authentification.js"></script>

  <!-- Animation Script -->
  <script>
    const signUpButton = document.getElementById('signUp');
    const signInButton = document.getElementById('signIn');
    const container = document.getElementById('container');

    signUpButton.addEventListener('click', () => {
      container.classList.add("right-panel-active");
    });

    signInButton.addEventListener('click', () => {
      container.classList.remove("right-panel-active");
    });
  </script>

</body>
</html>
