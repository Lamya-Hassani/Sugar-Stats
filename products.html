<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Le Labo | Sugar & Stats</title>

  <!-- Fonts & Icons -->
  <link
    href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Poppins:wght@300;400;500;600;700&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <!-- Global styles -->
  <link rel="stylesheet" href="styles/main.css">

  <style>
    /* ---------- HERO / PAGE HEADER ---------- */

    body {
      background: radial-gradient(circle at top, #ffffff 0, #FAFAFA 40%, #FBEFF4 100%);
    }

    .page-header {
      padding: 7rem 0 3rem;
      background: linear-gradient(135deg, rgba(197, 63, 107, 0.95), rgba(253, 180, 98, 0.9));
      color: #fff;
    }

    .page-header .container {
      max-width: var(--container);
      margin: 0 auto;
      padding: 0 2rem;
    }

    .page-header h1 {
      font-size: clamp(2.2rem, 4vw, 3rem);
      margin-bottom: 0.5rem;
    }

    .page-header p {
      opacity: 0.9;
      max-width: 420px;
    }

    /* ---------- FILTER BAR ---------- */

    .menu-main {
      position: relative;
      z-index: 5;
    }

    .filter-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 1.5rem;
      flex-wrap: wrap;
      margin: -2rem auto 3rem;
      padding: 1rem 1.5rem;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.8);
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.06);
    }

    #categoryContainer {
      display: flex;
      gap: 0.8rem;
      overflow-x: auto;
      padding-bottom: 0.3rem;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
    }

    #categoryContainer::-webkit-scrollbar {
      display: none;
    }

    .filter-btn {
      padding: 0.7rem 1.4rem;
      border-radius: 999px;
      border: 1px solid rgba(0, 0, 0, 0.05);
      background: #fff;
      cursor: pointer;
      transition: 0.25s;
      font-weight: 500;
      font-size: 0.9rem;
      white-space: nowrap;
    }

    .filter-btn.active,
    .filter-btn:hover {
      background: var(--c-accent);
      color: #fff;
      border-color: transparent;
    }

    .search-input {
      padding: 0.7rem 1.4rem;
      border-radius: 999px;
      border: 1px solid rgba(0, 0, 0, 0.06);
      width: 280px;
      outline: none;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.03);
      font-size: 0.9rem;
    }

    /* ---------- PRODUCTS GRID ---------- */

    .products-section {
      max-width: var(--container);
      margin: 0 auto;
      padding: 0 2rem 4rem;
    }

    .products-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 2rem;
      padding-bottom: 4rem;
    }

    .product-card {
      background: #fff;
      border-radius: 22px;
      overflow: hidden;
      border: 1px solid rgba(0, 0, 0, 0.04);
      box-shadow: 0 18px 45px rgba(197, 63, 107, 0.08);
      transition: all 0.35s cubic-bezier(0.16, 1, 0.3, 1);
      display: flex;
      flex-direction: column;
    }

    .product-card:hover {
      transform: translateY(-8px) scale(1.01);
      box-shadow: 0 26px 60px rgba(197, 63, 107, 0.16);
    }

    .product-img {
      width: 100%;
      height: 210px;
      object-fit: cover;
      filter: saturate(1.05);
    }

    .product-info {
      padding: 1.4rem 1.5rem 1.6rem;
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    .product-title {
      font-family: 'Playfair Display', serif;
      font-size: 1.15rem;
      font-weight: 700;
    }

    .product-desc {
      font-size: 0.9rem;
      opacity: 0.8;
    }

    .price {
      color: var(--c-accent);
      font-weight: 700;
      font-size: 1.1rem;
      margin-top: 0.3rem;
    }

    .product-actions {
      margin-top: 0.7rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 1rem;
    }

    .product-actions button {
      padding: 0.55rem 1.4rem;
      border-radius: 999px;
      border: none;
      cursor: pointer;
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      font-weight: 700;
      transition: 0.25s;
    }

    .btn-add {
      background: var(--gradient-brand);
      color: #fff;
      box-shadow: 0 4px 15px rgba(197, 63, 107, 0.25);
    }

    .btn-add:hover {
      background: var(--c-text);
    }

    .badge {
      background: rgba(163, 217, 201, 0.2);
      color: var(--c-teal);
      border-radius: 999px;
      padding: 0.25rem 0.75rem;
      font-size: 0.75rem;
      font-weight: 600;
    }

    /* ---------- RESPONSIVE ---------- */

    @media (max-width: 768px) {
      .filter-bar {
        flex-direction: column;
        align-items: stretch;
        border-radius: 24px;
        margin: -2.5rem 0 2rem;
      }

      .search-input {
        width: 100% !important;
        margin-top: 0.5rem;
      }

      .products-section {
        padding: 0 1.5rem 3rem;
      }
    }
  </style>
</head>

<body>
  <!-- HEADER -->
  <header>
    <div class="header-inner">
      <a href="index.html" class="navbar-brand">Sugar <span>&</span> Stats</a>
      <nav>
        <ul>
          <li><a href="about.html">Philosophie</a></li>
          <li><a href="products.html" class="active">Le Labo</a></li>
          <li><a href="index.html#gallery">Galerie</a></li>
          <li><a href="contact.html">Contact</a></li>
        </ul>
      </nav>
      <div class="nav-actions">
        <a href="pages/auth.html" class="login-btn">Connexion</a>
        <a href="cart.html" id="cart-link" style="font-weight:700;text-decoration:none;color:var(--c-text);">
          Panier (<span id="cart-count">0</span>)
        </a>
      </div>
    </div>
  </header>

  <!-- HERO -->
  <section class="page-header">
    <div class="container">
      <h1>Le Labo des Saveurs</h1>
      <p>Chaque création est une expérience réussie, mesurée au gramme près.</p>
    </div>
  </section>

  <!-- MAIN CONTENT -->
  <main class="menu-main">
    <section class="products-section">
      <!-- FILTER BAR -->
      <div class="filter-bar">
        <div id="categoryContainer">
        </div>

        <input type="text" class="search-input" id="searchInput" placeholder="Rechercher une saveur...">
      </div>

      <!-- PRODUCTS GRID -->
      <div id="productsGrid" class="products-grid">
      </div>
    </section>
  </main>

  <!-- FOOTER -->
  <footer style="padding:4rem 0;background:#ffffff;text-align:center;border-top:1px solid rgba(0,0,0,0.04);">
    <p>© 2024 Sugar &amp; Stats. Précision &amp; Plaisir.</p>
  </footer>

  <script src="scripts/cart-logic.js"></script>
  <script src="scripts/products.js"></script>
  <script src="scripts/authentification.js"></script>
</body>

</html>
